training:
  model_id: "Qwen/Qwen2-VL-2B-Instruct"
  output_dir: "/content/drive/MyDrive/idvlm/models/qwen2-vl-lora"
  num_train_epochs: 1    # 1 epoch is enough to see drastic improvement in JSON formatting
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  save_strategy: "epoch"
  eval_strategy: "epoch"
  logging_steps: 5
  bf16: true
  
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"
